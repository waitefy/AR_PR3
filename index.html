<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Практическая работа №3</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
    <a-scene
        mindar-face="filterMinCF: 0.001; filterBeta: 1.0"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="headModel" src="assets/headOccluder.glb"></a-asset-item>
            <a-asset-item id="maskModel" src="assets/mask.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" intensity="1.0" position="1 2 1"></a-light>

        <!-- Окклюдер лица для маскирования затылка и контуров головы в Z-буфере -->
        <a-entity mindar-face-target="anchorIndex: 168">
            <a-gltf-model
                mindar-face-occluder
                position="0 -0.3 0.15"
                scale="0.065 0.065 0.065"
                src="#headModel">
            </a-gltf-model>
        </a-entity>

        <!-- 3D-модель маски -->
        <a-entity mindar-face-target="anchorIndex: 168">
            <a-gltf-model
                position="0 -0.22 -0.23"
                scale="0.47 0.46 0.44"
                src="#maskModel">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
